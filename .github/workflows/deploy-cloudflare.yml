name: Deploy Retained Cloudflare Release

on:
  workflow_call:
    inputs:
      deploy_target:
        description: Logical Cloudflare target
        required: true
        type: string
      environment_name:
        description: Exact protected GitHub environment
        required: true
        type: string
      source_sha:
        description: Exact preview source SHA bound into the release manifest
        required: true
        type: string
      tooling_ref:
        description: Trusted commit containing deployment tooling
        required: true
        type: string
      artifact_run_id:
        description: Workflow run retaining the immutable release and preview evidence
        required: false
        default: ""
        type: string
      build_release:
        description: Build and retain the release before deploying it
        required: false
        default: false
        type: boolean
      require_preview_evidence:
        description: Require successful preview evidence for this exact release
        required: false
        default: false
        type: boolean
      apply_migrations:
        description: Apply retained forward D1 migrations before deploying code
        required: false
        default: true
        type: boolean
permissions:
  actions: read
  contents: read

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 10.30.2

jobs:
  deploy:
    name: ${{ inputs.deploy_target }} / retained release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ vars.HUNSU_WEB_PUBLIC_URL }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HUNSU_DEPLOY_TARGET: ${{ inputs.deploy_target }}
      HUNSU_RELEASE_SHA: ${{ inputs.source_sha }}
      HUNSU_WEB_PAGES_PROJECT: ${{ vars.HUNSU_WEB_PAGES_PROJECT }}
      HUNSU_WEB_PUBLIC_URL: ${{ vars.HUNSU_WEB_PUBLIC_URL }}
      HUNSU_BRIDGE_API_BASE_URL: ${{ vars.HUNSU_BRIDGE_API_BASE_URL }}
      HUNSU_CONNECT_API_BASE_URL: ${{ vars.HUNSU_CONNECT_API_BASE_URL }}
      HUNSU_CONNECT_WORKER_NAME: ${{ vars.HUNSU_CONNECT_WORKER_NAME }}
      HUNSU_CONNECT_D1_DATABASE_NAME: ${{ vars.HUNSU_CONNECT_D1_DATABASE_NAME }}
      HUNSU_CONNECT_D1_DATABASE_ID: ${{ vars.HUNSU_CONNECT_D1_DATABASE_ID }}
      HUNSU_CONNECT_ACCESS_ISSUER: ${{ vars.HUNSU_CONNECT_ACCESS_ISSUER }}
      HUNSU_CONNECT_ACCESS_AUD: ${{ vars.HUNSU_CONNECT_ACCESS_AUD }}
      HUNSU_CONNECT_SIGNING_PUBLIC_JWK: ${{ vars.HUNSU_CONNECT_SIGNING_PUBLIC_JWK }}
      HUNSU_CONNECT_SIGNING_KEY_ID: ${{ vars.HUNSU_CONNECT_SIGNING_KEY_ID }}
      HUNSU_HUB_WORKER_NAME: ${{ vars.HUNSU_HUB_WORKER_NAME }}
      HUNSU_HUB_ORIGIN_NAME: ${{ vars.HUNSU_HUB_ORIGIN_NAME }}
      HUNSU_HUB_PUBLIC_API_URL: ${{ vars.HUNSU_HUB_PUBLIC_API_URL }}
      HUNSU_HUB_D1_DATABASE_NAME: ${{ vars.HUNSU_HUB_D1_DATABASE_NAME }}
      HUNSU_HUB_D1_DATABASE_ID: ${{ vars.HUNSU_HUB_D1_DATABASE_ID }}
      HUNSU_HUB_R2_BUCKET_NAME: ${{ vars.HUNSU_HUB_R2_BUCKET_NAME }}
    steps:
      - name: Validate protected target mapping
        env:
          EXPECTED_ENVIRONMENT: ${{ inputs.deploy_target == 'preview' && 'hunsu-preview' || 'hunsu-production' }}
          ACTUAL_ENVIRONMENT: ${{ inputs.environment_name }}
          BUILD_RELEASE: ${{ inputs.build_release }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ACTUAL_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]]; then
            echo "Target $HUNSU_DEPLOY_TARGET must use GitHub environment $EXPECTED_ENVIRONMENT." >&2
            exit 1
          fi
          if [[ "$BUILD_RELEASE" != "true" && ! "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "A numeric artifact_run_id is required when deploying a retained release." >&2
            exit 1
          fi
          if [[ "$BUILD_RELEASE" == "true" && "$HUNSU_DEPLOY_TARGET" != "preview" ]]; then
            echo "Only the preview workflow may build a release artifact." >&2
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tooling_ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate preview source before retaining artifacts
        if: inputs.build_release
        run: pnpm run check
      - name: Build one neutral Web and Worker release
        if: inputs.build_release
        run: node scripts/deployment/build-release.mjs "$RUNNER_TEMP/deployment-release"
      - name: Retain immutable preview release
        if: inputs.build_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-release-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/deployment-release/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Wait for exact-SHA Bridge candidate publication
        if: inputs.build_release
        id: bridge_candidate_run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const deadline = Date.now() + 25 * 60 * 1000;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "publish-bridge.yml",
                head_sha: process.env.SOURCE_SHA,
                event: "push",
                per_page: 20
              });
              const run = response.data.workflow_runs.find(candidate =>
                candidate.head_sha === process.env.SOURCE_SHA
                && candidate.head_branch === "preview"
                && candidate.event === "push"
              );
              if (run?.conclusion === "success") {
                core.setOutput("run_id", String(run.id));
                core.info(`Using exact-SHA Bridge candidate run ${run.html_url}.`);
                return;
              }
              if (run?.status === "completed") {
                core.setFailed(`Bridge candidate publication failed for ${process.env.SOURCE_SHA}: ${run.html_url}.`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(`Timed out waiting for Bridge candidate publication for ${process.env.SOURCE_SHA}.`);
      - name: Download exact-SHA Bridge candidate evidence
        if: inputs.build_release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-candidate-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/bridge-candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.bridge_candidate_run.outputs.run_id }}
      - name: Verify npm candidate identity and registry integrity
        if: inputs.build_release
        env:
          HUNSU_BRIDGE_CANDIDATE_RUN_ID: ${{ steps.bridge_candidate_run.outputs.run_id }}
        run: >-
          node scripts/deployment/verify-bridge-candidate.mjs
          "$RUNNER_TEMP/deployment-release"
          "$RUNNER_TEMP/bridge-candidate"
          "$RUNNER_TEMP/bridge-candidate-binding.json"
      - name: Download retained immutable release
        if: ${{ !inputs.build_release }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-release-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/deployment-release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Download exact preview evidence
        if: inputs.require_preview_evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-deployment-evidence-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/preview-evidence
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id }}
      - name: Verify preview evidence is bound to the retained release
        if: inputs.require_preview_evidence
        run: >-
          node scripts/deployment/verify-preview-evidence.mjs
          "$RUNNER_TEMP/deployment-release"
          "$RUNNER_TEMP/preview-evidence/evidence.json"
          "$RUNNER_TEMP/bridge-candidate-binding.json"
      - name: Generate target bindings without rebuilding product artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunsu-cloudflare"
          pnpm --filter @hunsu/hub-api exec node --conditions=development scripts/cloudflare-config.mjs print \
            > "$RUNNER_TEMP/hunsu-cloudflare/hub.toml"
          pnpm --filter @hunsu/connect-api exec node --conditions=development scripts/cloudflare-config.mjs print \
            > "$RUNNER_TEMP/hunsu-cloudflare/connect.json"
          node scripts/deployment/prepare-deployment.mjs \
            "$RUNNER_TEMP/deployment-release" \
            "$RUNNER_TEMP/hunsu-deploy" \
            "$RUNNER_TEMP/hunsu-cloudflare/hub.toml" \
            "$RUNNER_TEMP/hunsu-cloudflare/connect.json"
      - name: Validate and materialize the protected Connect deploy secret
        env:
          HUNSU_CONNECT_SIGNING_PRIVATE_JWK: ${{ secrets.HUNSU_CONNECT_SIGNING_PRIVATE_JWK }}
        run: >-
          node scripts/deployment/write-connect-secrets-file.mjs
          "$RUNNER_TEMP/hunsu-connect-secrets.json"
      - name: Record production D1 recovery bookmarks
        if: inputs.deploy_target == 'production' && inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hunsu-deploy/d1-recovery"
          recovery_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pnpm --filter @hunsu/hub-api exec wrangler d1 time-travel info "$HUNSU_HUB_D1_DATABASE_NAME" \
            --config "$RUNNER_TEMP/hunsu-deploy/hub/wrangler.toml" \
            --timestamp "$recovery_timestamp" \
            --json | tee "$RUNNER_TEMP/hunsu-deploy/d1-recovery/hub.json"
          pnpm --filter @hunsu/connect-api exec wrangler d1 time-travel info "$HUNSU_CONNECT_D1_DATABASE_NAME" \
            --config "$RUNNER_TEMP/hunsu-deploy/connect/wrangler.json" \
            --timestamp "$recovery_timestamp" \
            --json | tee "$RUNNER_TEMP/hunsu-deploy/d1-recovery/connect.json"
      - name: Retain production D1 recovery bookmarks immediately
        if: inputs.deploy_target == 'production' && inputs.apply_migrations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-d1-recovery-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/hunsu-deploy/d1-recovery/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Apply retained Hub forward migrations
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @hunsu/hub-api exec wrangler d1 migrations apply
          "$HUNSU_HUB_D1_DATABASE_NAME"
          --config "$RUNNER_TEMP/hunsu-deploy/hub/wrangler.toml"
          --remote
      - name: Apply retained Connect forward migrations
        if: inputs.apply_migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @hunsu/connect-api exec wrangler d1 migrations apply
          "$HUNSU_CONNECT_D1_DATABASE_NAME"
          --config "$RUNNER_TEMP/hunsu-deploy/connect/wrangler.json"
          --remote
      - name: Deploy retained Hub Worker module
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @hunsu/hub-api exec wrangler deploy
          --config "$RUNNER_TEMP/hunsu-deploy/hub/wrangler.toml"
          --no-bundle
          --message "Hunsu $HUNSU_DEPLOY_TARGET $HUNSU_RELEASE_SHA"
      - name: Deploy retained Connect Worker module
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --filter @hunsu/connect-api exec wrangler deploy
          --config "$RUNNER_TEMP/hunsu-deploy/connect/wrangler.json"
          --no-bundle
          --secrets-file "$RUNNER_TEMP/hunsu-connect-secrets.json"
          --message "Hunsu Connect $HUNSU_DEPLOY_TARGET $HUNSU_RELEASE_SHA"
      - name: Remove the protected Connect deploy secret file
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/hunsu-connect-secrets.json"
      - name: Rotate ephemeral Hub seed authority and seed immutable examples
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          seed_token=$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')
          cleanup() {
            unset seed_token
          }
          trap cleanup EXIT
          printf '%s' "$seed_token" | pnpm --filter @hunsu/hub-api exec wrangler secret put HUNSU_HUB_ADMIN_TOKEN \
            --config "$RUNNER_TEMP/hunsu-deploy/hub/wrangler.toml"
          unset CLOUDFLARE_API_TOKEN
          HUNSU_HUB_ADMIN_TOKEN="$seed_token" \
            HUNSU_HUB_SEED_ATTEMPTS=90 \
            HUNSU_HUB_SEED_DELAY_MS=10000 \
            pnpm --filter @hunsu/hub-api exec node --conditions=development scripts/seed-local.mjs
      - name: Deploy retained Web assets with target runtime overlay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_BRANCH: ${{ inputs.deploy_target == 'preview' && 'preview' || 'main' }}
        run: >-
          pnpm --filter @hunsu/hub-api exec wrangler pages deploy
          "$RUNNER_TEMP/hunsu-deploy/web"
          --project-name "$HUNSU_WEB_PAGES_PROJECT"
          --branch "$PAGES_BRANCH"
          --commit-hash "$HUNSU_RELEASE_SHA"
          --commit-message "Hunsu $HUNSU_DEPLOY_TARGET $HUNSU_RELEASE_SHA"
      - name: Ensure the exact Pages custom domain is active
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deployment/ensure-pages-domain.mjs
      - name: Verify deployed Web, Hub, and Connect release identity
        run: >-
          node scripts/deployment/smoke-deployment.mjs
          "$RUNNER_TEMP/deployment-release"
          "$RUNNER_TEMP/bridge-candidate-binding.json"
          "$RUNNER_TEMP/hunsu-deploy/evidence.json"
      - name: Publish credential-free deployment evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.deploy_target }}-deployment-evidence-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/hunsu-deploy/evidence.json
            ${{ runner.temp }}/hunsu-deploy/deployment-input.json
            ${{ runner.temp }}/hunsu-deploy/d1-recovery/
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Publish failure diagnostics without a success evidence name
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.deploy_target }}-deployment-failure-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/hunsu-deploy/deployment-input.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
