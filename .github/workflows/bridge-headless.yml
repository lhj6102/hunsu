name: Bridge Headless

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bridge-headless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 10.30.2

jobs:
  validate:
    name: Validate and enforce local gate budget
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for the complete local gate
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the complete Bridge gate with its documented threshold
        env:
          HUNSU_VERIFY_BRIDGE_BUDGET_MS: 330000
          HUNSU_VERIFY_BRIDGE_THRESHOLD_MS: 30000
        run: pnpm run verify:bridge:budget
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### Validate elapsed: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Foreground daemon integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run the CLI foreground scenario
        run: pnpm run test:headless:scenario
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### Integration elapsed: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"

  chromium:
    name: Chromium Web stack
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run proxy and direct-localhost modes
        run: pnpm run test:e2e:stack
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### Chromium elapsed: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: npm tarball smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Pack and install in an empty project
        run: pnpm run test:package:bridge
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### Package elapsed: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"
