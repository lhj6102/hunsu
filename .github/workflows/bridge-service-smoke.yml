name: Bridge Service Adapter Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0
  PNPM_VERSION: 10.30.2

jobs:
  service:
    name: Service adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Bridge
        run: pnpm --filter @hunsu/bridge build
      - name: Stage the built package as the runtime under test
        shell: pwsh
        run: |
          $env:HUNSU_HOME = Join-Path $env:RUNNER_TEMP "hunsu-service-smoke"
          $nodePath = (& node -p "process.execPath").Trim()
          $packageVersion = (& node -p "require('./apps/bridge/package.json').version").Trim()
          $cliPath = (Resolve-Path "apps/bridge/dist/cli.js").Path
          $runtimePath = (Resolve-Path "apps/bridge").Path
          $installPath = Join-Path $env:HUNSU_HOME "runtime/install.json"
          New-Item -ItemType Directory -Force (Split-Path $installPath) | Out-Null
          $now = (Get-Date).ToUniversalTime().ToString("o")
          $installation = @{
            packageVersion = $packageVersion
            runtimePath = $runtimePath
            nodePath = $nodePath
            cliPath = $cliPath
            installedAt = $now
          }
          $serviceInput = @{
            nodePath = $nodePath
            cliPath = $cliPath
            hunsuHome = $env:HUNSU_HOME
            packageVersion = $packageVersion
            runtimePath = $runtimePath
          }
          @{
            schema = "hunsu.bridge.runtime-install.v1"
            current = $installation
            previous = $null
            serviceInput = $serviceInput
            updatedAt = $now
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 -NoNewline $installPath
      - name: Exercise user service lifecycle
        shell: pwsh
        run: |
          $env:HUNSU_HOME = Join-Path $env:RUNNER_TEMP "hunsu-service-smoke"
          $expectedRuntimePath = (Resolve-Path "apps/bridge").Path
          $expectedPackageVersion = (& node -p "require('./apps/bridge/package.json').version").Trim()
          function Invoke-Bridge {
            param([string[]]$Arguments)
            & node "apps/bridge/dist/cli.js" @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "hunsu-bridge $($Arguments -join ' ') failed with exit code $LASTEXITCODE"
            }
          }
          Invoke-Bridge @("service", "install", "--json") | Out-Host
          Invoke-Bridge @("service", "start", "--json") | Out-Host

          $healthyStatus = $null
          $lastCandidate = $null
          for ($attempt = 0; $attempt -lt 100; $attempt += 1) {
            $candidate = Invoke-Bridge @("service", "status", "--json") | ConvertFrom-Json
            $lastCandidate = $candidate
            if (
              $candidate.value.installed -eq $true -and
              $candidate.value.managerState -eq "running" -and
              $candidate.value.health -eq "healthy" -and
              $candidate.value.authentication -eq "authenticated"
            ) {
              $healthyStatus = $candidate
              break
            }
            Start-Sleep -Milliseconds 100
          }
          if ($null -eq $healthyStatus) {
            Write-Host "Last Bridge service status:"
            $lastCandidate | ConvertTo-Json -Depth 8 | Out-Host

            if ($IsWindows) {
              $task = Get-ScheduledTask -TaskName "Hunsu Bridge"
              $taskInfo = $task | Get-ScheduledTaskInfo
              Write-Host "Scheduled task diagnostics:"
              [pscustomobject]@{
                CurrentIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
                CurrentSessionId = (Get-Process -Id $PID).SessionId
                State = $task.State
                LastRunTime = $taskInfo.LastRunTime
                LastTaskResult = $taskInfo.LastTaskResult
                Execute = $task.Actions[0].Execute
                Arguments = $task.Actions[0].Arguments
                WorkingDirectory = $task.Actions[0].WorkingDirectory
                PrincipalUserId = $task.Principal.UserId
                PrincipalLogonType = $task.Principal.LogonType
                PrincipalRunLevel = $task.Principal.RunLevel
              } | ConvertTo-Json -Depth 8 | Out-Host

              Write-Host "HUNSU_HOME file inventory (contents excluded):"
              Get-ChildItem -LiteralPath $env:HUNSU_HOME -Recurse -Force -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, Attributes |
                ConvertTo-Json -Depth 4 |
                Out-Host
              $credentialsPath = Join-Path $env:HUNSU_HOME "credentials.json"
              if (Test-Path -LiteralPath $credentialsPath) {
                Write-Host "Credential ACL (credential contents excluded):"
                Get-Acl -LiteralPath $credentialsPath |
                  Select-Object Owner, AccessToString, AreAccessRulesProtected |
                  ConvertTo-Json -Depth 4 |
                  Out-Host
              }
              $runtimeFile = Join-Path $env:HUNSU_HOME "runtime.json"
              if (Test-Path -LiteralPath $runtimeFile) {
                Write-Host "Runtime identity:"
                Get-Content -LiteralPath $runtimeFile -Raw | Out-Host
              }
              $structuredLog = Join-Path $env:HUNSU_HOME "logs/bridge.jsonl"
              if (Test-Path -LiteralPath $structuredLog) {
                Write-Host "Bridge structured log:"
                Get-Content -LiteralPath $structuredLog | Out-Host
              }

              Stop-ScheduledTask -TaskName "Hunsu Bridge" -ErrorAction SilentlyContinue
              $directStdout = Join-Path $env:RUNNER_TEMP "hunsu-bridge-direct.stdout.log"
              $directStderr = Join-Path $env:RUNNER_TEMP "hunsu-bridge-direct.stderr.log"
              Remove-Item -Force -ErrorAction SilentlyContinue $directStdout, $directStderr
              Write-Host "Starting the registered action directly in the workflow session."
              $directProcessOptions = @{
                FilePath = $task.Actions[0].Execute
                ArgumentList = $task.Actions[0].Arguments
                PassThru = $true
                RedirectStandardOutput = $directStdout
                RedirectStandardError = $directStderr
              }
              $direct = Start-Process @directProcessOptions
              $directStatus = $null
              try {
                for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
                  $candidate = Invoke-Bridge @("service", "status", "--json") | ConvertFrom-Json
                  if ($candidate.value.health -eq "healthy" -and $candidate.value.authentication -eq "authenticated") {
                    $directStatus = $candidate
                    break
                  }
                  if ($direct.HasExited) {
                    break
                  }
                  Start-Sleep -Milliseconds 100
                }
                Write-Host "Direct action Bridge status:"
                $directStatus | ConvertTo-Json -Depth 8 | Out-Host
                if ($direct.HasExited) {
                  Write-Host "Direct action exit code: $($direct.ExitCode)"
                } else {
                  Write-Host "Direct action remained running."
                }
              } finally {
                & node "apps/bridge/dist/cli.js" service stop --json | Out-Host
                if (-not $direct.HasExited) {
                  Stop-Process -Id $direct.Id -Force -ErrorAction SilentlyContinue
                }
                Wait-Process -Id $direct.Id -ErrorAction SilentlyContinue
                Write-Host "Direct action stdout:"
                Get-Content -LiteralPath $directStdout -ErrorAction SilentlyContinue | Out-Host
                Write-Host "Direct action stderr:"
                Get-Content -LiteralPath $directStderr -ErrorAction SilentlyContinue | Out-Host
              }
            }
            throw "The installed user service never reached healthy authenticated status."
          }
          if ($healthyStatus.value.packageVersion -ne $expectedPackageVersion) {
            throw "Service status reported the wrong installed package version."
          }
          if ($healthyStatus.value.runtimePath -ne $expectedRuntimePath) {
            throw "Service status reported the wrong configured runtime path."
          }
          $healthyStatus | ConvertTo-Json -Depth 8 | Out-Host

          Invoke-Bridge @("service", "stop", "--json") | Out-Host
          $stoppedStatus = $null
          for ($attempt = 0; $attempt -lt 100; $attempt += 1) {
            $candidate = Invoke-Bridge @("service", "status", "--json") | ConvertFrom-Json
            if ($candidate.value.managerState -eq "stopped" -and $candidate.value.health -ne "healthy") {
              $stoppedStatus = $candidate
              break
            }
            Start-Sleep -Milliseconds 100
          }
          if ($null -eq $stoppedStatus) {
            throw "The stopped user service still appeared active or healthy."
          }
          $stoppedStatus | ConvertTo-Json -Depth 8 | Out-Host

          Invoke-Bridge @("service", "uninstall", "--json") | Out-Host
          $removedStatus = Invoke-Bridge @("service", "status", "--json") | ConvertFrom-Json
          if ($removedStatus.value.installed -ne $false) {
            throw "The user service definition remained installed after uninstall."
          }
          $removedStatus | ConvertTo-Json -Depth 8 | Out-Host
      - name: Best-effort cleanup
        if: always()
        shell: pwsh
        run: |
          $env:HUNSU_HOME = Join-Path $env:RUNNER_TEMP "hunsu-service-smoke"
          & node "apps/bridge/dist/cli.js" service stop --json
          & node "apps/bridge/dist/cli.js" service uninstall --json
          exit 0
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### ${{ matrix.os }} elapsed: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"
