name: Bridge Tarball Service Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 10.30.2

jobs:
  package:
    name: Build one immutable tarball
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:no-desktop-prototype
      - name: Pack the exact source once
        shell: bash
        run: |
          mkdir -p bridge-service-package
          pnpm --filter @hunsu/bridge pack --pack-destination "$PWD/bridge-service-package"
          test "$(find bridge-service-package -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1
          sha256sum bridge-service-package/*.tgz > bridge-service-package/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-service-package-${{ github.sha }}
          path: bridge-service-package/
          if-no-files-found: error
          retention-days: 7

  service:
    name: Tarball setup (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-service-package-${{ github.sha }}
          path: bridge-service-package
      - name: Exercise packed CLI setup through the OS user service
        shell: bash
        run: node scripts/bridge-service-smoke.mjs --tarball "$PWD/"bridge-service-package/*.tgz
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### ${{ matrix.os }} tarball setup: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"
