name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: CI / validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm 10.30.2
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.2
          run_install: false

      - name: Set up Node.js 24.18
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete repository checks
        run: pnpm check

      - name: Build all production packages and applications
        run: pnpm build

      - name: Install the pinned Playwright Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Dashboard browser and accessibility contracts
        run: pnpm run test:browser

      - name: Validate production and Plugin contracts
        run: |
          pnpm run plugin:validate
          pnpm run worker:types:check
          node scripts/deployment/validate-production-contract.mjs

      - name: Write credential-free production runtime overlay
        run: node scripts/deployment/write-web-runtime-config.mjs --source-sha "$GITHUB_SHA"

      - name: Bundle Worker without deploying
        run: |
          mkdir -p .artifacts
          pnpm exec wrangler deploy --dry-run --outdir .artifacts/worker-bundle --metafile .artifacts/worker-bundle-meta.json

      - name: Verify Worker bundle excludes the Node server
        run: node scripts/deployment/validate-worker-bundle.mjs --bundle-dir .artifacts/worker-bundle --metafile .artifacts/worker-bundle-meta.json

      - name: Run Cloudflare adapter and OAuth Durable Object tests
        run: pnpm run test:cloudflare
