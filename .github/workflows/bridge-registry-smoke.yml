name: Bridge Registry Candidate Smoke

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Exact candidate Git tag, for example v0.2.0-next.11
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: 24.18.0
  NPM_REGISTRY_URL: https://registry.npmjs.org
  npm_config_registry: https://registry.npmjs.org

jobs:
  identity:
    name: Verify registry candidate identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      verified_sha: ${{ steps.identity.outputs.verified_sha }}
      integrity: ${{ steps.identity.outputs.integrity }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Require the exact published candidate
        id: identity
        env:
          VERSION_TAG: ${{ inputs.version_tag }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || "$GITHUB_REF_NAME" != "$VERSION_TAG" ]]; then
            echo "Dispatch registry smoke from the exact candidate tag." >&2
            exit 1
          fi
          checked_out_sha=$(git rev-parse HEAD)
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "The registry smoke checkout does not match the dispatch SHA." >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${VERSION_TAG}:refs/tags/hunsu-registry-smoke-tag"
          remote_tag_sha=$(git rev-parse "refs/tags/hunsu-registry-smoke-tag^{commit}")
          if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The candidate tag moved after this registry smoke was dispatched." >&2
            exit 1
          fi
          version=$(node -p "require('./apps/bridge/package.json').version")
          if [[ "$VERSION_TAG" != "v$version" ]]; then
            echo "Candidate tag does not match the Bridge package version." >&2
            exit 1
          fi
          registry_version=$(npm view "@hunsu/bridge@$version" version --registry="$NPM_REGISTRY_URL")
          registry_integrity=$(npm view "@hunsu/bridge@$version" dist.integrity --registry="$NPM_REGISTRY_URL")
          candidate_tag=$(npm view @hunsu/bridge dist-tags.candidate-next --registry="$NPM_REGISTRY_URL")
          if [[ "$registry_version" != "$version" || "$candidate_tag" != "$version" ]]; then
            echo "The exact version is not the active candidate-next publication." >&2
            exit 1
          fi
          if [[ ! "$registry_integrity" =~ ^sha512-[A-Za-z0-9+/]+={0,2}$ ]]; then
            echo "The exact candidate does not expose a valid sha512 registry integrity." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "verified_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "integrity=$registry_integrity" >> "$GITHUB_OUTPUT"
          {
            echo "### Exact Bridge registry candidate"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- Tag: \`$VERSION_TAG\`"
            echo "- Package: \`@hunsu/bridge@$version\`"
            echo "- Integrity: \`$registry_integrity\`"
          } >> "$GITHUB_STEP_SUMMARY"

  service:
    name: Registry setup (${{ matrix.os }})
    needs: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    steps:
      - name: Record start
        id: timer
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.identity.outputs.verified_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.NPM_REGISTRY_URL }}
      - name: Exercise exact registry npx setup through the OS user service
        run: node scripts/bridge-service-smoke.mjs --registry-version "${{ needs.identity.outputs.version }}"
      - name: Report elapsed time
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.timer.outputs.started }} ))
          echo "### ${{ matrix.os }} registry setup: $elapsed seconds" >> "$GITHUB_STEP_SUMMARY"
