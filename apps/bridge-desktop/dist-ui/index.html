<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hunsu Bridge</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fa;
        color: #18202f;
      }
      body {
        margin: 0;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }
      section {
        margin-top: 18px;
        border: 1px solid #dce2ea;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        padding: 16px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 14px;
        letter-spacing: 0;
      }
      dl {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 8px 12px;
        margin: 0;
        font-size: 13px;
      }
      dt {
        color: #667085;
      }
      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        min-height: 36px;
        border: 1px solid #ccd5e0;
        border-radius: 8px;
        background: #ffffff;
        color: #18202f;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      button.primary {
        border-color: #1f6feb;
        background: #1f6feb;
        color: #ffffff;
      }
      pre {
        max-height: 180px;
        overflow: auto;
        border-radius: 8px;
        background: #111827;
        color: #e5edf8;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        gap: 10px;
      }
      .project-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border-top: 1px solid #e5ebf2;
        padding: 10px 0;
      }
      .project-row:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .project-title {
        font-size: 13px;
        font-weight: 700;
      }
      .project-meta,
      .message {
        margin-top: 4px;
        color: #667085;
        font-size: 12px;
        line-height: 1.45;
      }
      .status-connected {
        color: #138a4f;
      }
      .status-warning {
        color: #ad6500;
      }
      .status-error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hunsu Bridge</h1>
        <div class="actions">
          <button id="refresh">Refresh</button>
          <button id="open-studio" class="primary">Open Studio</button>
        </div>
      </header>

      <section>
        <h2>Status</h2>
        <dl>
          <dt>Local Bridge</dt>
          <dd id="local-bridge">Not Running</dd>
          <dt>Account</dt>
          <dd id="account">Signed out</dd>
          <dt>Remote Access</dt>
          <dd id="remote-access">Off</dd>
          <dt>Device</dt>
          <dd id="device">Unknown</dd>
          <dt>Service</dt>
          <dd id="service">Not installed</dd>
        </dl>
      </section>

      <section>
        <h2>Projects</h2>
        <div class="actions">
          <button id="choose-folder" class="primary">Choose Folder</button>
          <button id="open-project">Open Existing Roadmap</button>
          <button id="port-project">Port Git Project</button>
          <button id="create-roadmap">Create Roadmap</button>
        </div>
        <div id="selected-project" class="message">No folder selected.</div>
        <div id="recent-projects" class="grid" style="margin-top: 14px;"></div>
      </section>

      <section>
        <h2>Actions</h2>
        <div class="actions">
          <button id="start-bridge">Start Bridge</button>
          <button id="stop-bridge">Stop Bridge</button>
          <button id="copy-diagnostics">Copy Diagnostics</button>
          <button id="sign-in">Sign In</button>
          <button id="enable-remote">Enable Remote Access</button>
          <button id="disable-remote">Disable Remote Access</button>
          <button id="install-protocol">Install hunsu:// Handler</button>
        </div>
      </section>

      <section>
        <h2>Diagnostics</h2>
        <pre id="diagnostics">{}</pre>
      </section>
    </main>

    <script type="module">
      const invoke = window.__TAURI__?.core?.invoke;
      const diagnostics = document.querySelector("#diagnostics");
      const statusEls = {
        localBridge: document.querySelector("#local-bridge"),
        account: document.querySelector("#account"),
        remoteAccess: document.querySelector("#remote-access"),
        device: document.querySelector("#device"),
        service: document.querySelector("#service")
      };
      const recentProjects = document.querySelector("#recent-projects");
      const selectedProject = document.querySelector("#selected-project");
      let latestSnapshot = undefined;
      let selectedInspection = undefined;

      async function open(url) {
        if (invoke) await invoke("open_external", { url });
        else window.location.href = url;
      }

      async function run(args) {
        if (!invoke) throw new Error("Tauri invoke is unavailable.");
        const output = await invoke("run_bridge_app_command", { input: { args } });
        if (output.status !== 0) {
          throw new Error(output.stderr || output.stdout || `Command failed: ${args.join(" ")}`);
        }
        return output.stdout;
      }

      async function spawn(args) {
        if (!invoke) {
          await open(`hunsu://${args[0]}`);
          return;
        }
        await invoke("spawn_bridge_app_command", { input: { args } });
      }

      async function refresh() {
        try {
          const stdout = await run(["snapshot"]);
          latestSnapshot = JSON.parse(stdout);
          renderSnapshot(latestSnapshot);
        } catch (error) {
          statusEls.localBridge.textContent = "Error";
          statusEls.localBridge.className = "status-error";
          diagnostics.textContent = JSON.stringify({ error: String(error) }, null, 2);
        }
      }

      function renderSnapshot(snapshot) {
        const status = snapshot.status;
        statusEls.localBridge.textContent = labelLocalBridge(status.localBridge);
        statusEls.localBridge.className = status.localBridge === "connected" ? "status-connected" : status.localBridge === "error" ? "status-error" : "status-warning";
        statusEls.account.textContent = status.account;
        statusEls.remoteAccess.textContent = status.remoteAccess;
        statusEls.device.textContent = `${status.device.name}${status.device.registered ? " (registered)" : ""}`;
        statusEls.service.textContent = status.service.installed ? `Installed (${status.service.manager})` : "Not installed";
        diagnostics.textContent = JSON.stringify({
          diagnostics: snapshot.diagnostics,
          logs: snapshot.logLines
        }, null, 2);
        recentProjects.replaceChildren(...snapshot.recentProjects.map(projectRow));
      }

      function projectRow(project) {
        const row = document.createElement("div");
        row.className = "project-row";
        const body = document.createElement("div");
        body.innerHTML = `<div class="project-title"></div><div class="project-meta"></div>`;
        body.querySelector(".project-title").textContent = project.displayName;
        body.querySelector(".project-meta").textContent = `${project.health} · ${project.repositoryPath}`;
        const button = document.createElement("button");
        const action = project.primaryAction || (project.health === "ok" ? "open" : "remove");
        button.textContent = action === "open" ? "Open" : action === "repair" ? "Repair" : "Remove";
        button.addEventListener("click", async () => {
          if (action === "open") {
            await spawn(["open-roadmap", project.roadmapId]);
          } else if (action === "repair") {
            await spawn(["create", project.repositoryPath]);
          } else {
            await run(["projects", "remove", "--roadmap-id", project.roadmapId]);
          }
          await refresh();
        });
        row.append(body, button);
        return row;
      }

      function labelLocalBridge(value) {
        if (value === "connected") return "Connected";
        if (value === "starting") return "Starting";
        if (value === "error") return "Error";
        return "Not Running";
      }

      async function inspectSelectedFolder(path) {
        const stdout = await run(["inspect", path, "--json"]);
        selectedInspection = JSON.parse(stdout).project;
        selectedProject.textContent = `${formatProjectKind(selectedInspection.kind)} · ${selectedInspection.path || path} · Primary action: ${selectedInspection.recommendedAction}`;
      }

      function formatProjectKind(kind) {
        if (kind === "hunsu-roadmap") return "Existing Hunsu Roadmap";
        if (kind === "git-project") return "Git project";
        if (kind === "new-project") return "New project folder";
        if (kind === "missing-roadmap") return "Missing Roadmap";
        return "Unsupported folder";
      }

      async function runSelectedAction(action) {
        if (!selectedInspection) {
          await open("hunsu://open-project");
          return;
        }
        const path = selectedInspection.path;
        if (action === "open") await spawn(["open-project", path]);
        if (action === "port") await spawn(["port", path]);
        if (action === "create") await spawn(["create", path]);
      }

      document.querySelector("#refresh").addEventListener("click", refresh);
      document.querySelector("#open-studio").addEventListener("click", () => spawn(["pair"]));
      document.querySelector("#open-project").addEventListener("click", () => runSelectedAction("open"));
      document.querySelector("#port-project").addEventListener("click", () => runSelectedAction("port"));
      document.querySelector("#create-roadmap").addEventListener("click", () => runSelectedAction("create"));
      document.querySelector("#sign-in").addEventListener("click", () => spawn(["login", "--gui"]));
      document.querySelector("#enable-remote").addEventListener("click", async () => {
        await run(["remote", "enable"]);
        await refresh();
      });
      document.querySelector("#disable-remote").addEventListener("click", async () => {
        await run(["remote", "disable"]);
        await refresh();
      });
      document.querySelector("#install-protocol").addEventListener("click", async () => {
        const stdout = await run(["protocol", "install"]);
        diagnostics.textContent = stdout;
      });
      document.querySelector("#start-bridge").addEventListener("click", async () => {
        if (invoke) await invoke("start_bridge_sidecar", {});
        window.setTimeout(refresh, 600);
      });
      document.querySelector("#stop-bridge").addEventListener("click", async () => {
        await run(["stop"]);
        await refresh();
      });
      document.querySelector("#choose-folder").addEventListener("click", async () => {
        if (!invoke) return;
        const folder = await invoke("choose_project_folder");
        if (folder?.path) {
          await inspectSelectedFolder(folder.path);
        }
      });
      document.querySelector("#copy-diagnostics").addEventListener("click", async () => {
        await navigator.clipboard.writeText(diagnostics.textContent || "{}");
      });
      void refresh();
      window.setInterval(refresh, 3000);
    </script>
  </body>
</html>
