<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hunsu Bridge</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fa;
        color: #18202f;
      }
      body {
        margin: 0;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }
      section {
        margin-top: 18px;
        border: 1px solid #dce2ea;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        padding: 16px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 14px;
        letter-spacing: 0;
      }
      dl {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 8px 12px;
        margin: 0;
        font-size: 13px;
      }
      dt {
        color: #667085;
      }
      dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        min-height: 36px;
        border: 1px solid #ccd5e0;
        border-radius: 8px;
        background: #ffffff;
        color: #18202f;
        padding: 0 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      button.primary {
        border-color: #1f6feb;
        background: #1f6feb;
        color: #ffffff;
      }
      pre {
        max-height: 180px;
        overflow: auto;
        border-radius: 8px;
        background: #111827;
        color: #e5edf8;
        padding: 12px;
        font-size: 12px;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        gap: 10px;
      }
      .project-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        border-top: 1px solid #e5ebf2;
        padding: 10px 0;
      }
      .project-row:first-child {
        border-top: 0;
        padding-top: 0;
      }
      .empty-row {
        color: #667085;
        font-size: 12px;
        line-height: 1.45;
      }
      .project-title {
        font-size: 13px;
        font-weight: 700;
      }
      .project-meta,
      .message {
        margin-top: 4px;
        color: #667085;
        font-size: 12px;
        line-height: 1.45;
      }
      .status-connected {
        color: #138a4f;
      }
      .status-warning {
        color: #ad6500;
      }
      .status-error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Hunsu Bridge</h1>
        <div class="actions">
          <button id="refresh">Refresh</button>
          <button id="open-studio" class="primary">Open Studio</button>
        </div>
      </header>

      <section>
        <h2>Status</h2>
        <dl>
          <dt>Local Bridge</dt>
          <dd id="local-bridge">Not Running</dd>
          <dt>Account</dt>
          <dd id="account">Signed out</dd>
          <dt>Remote Access</dt>
          <dd id="remote-access">Off</dd>
          <dt>Device</dt>
          <dd id="device">Unknown</dd>
          <dt>Service</dt>
          <dd id="service">Not installed</dd>
        </dl>
      </section>

      <section>
        <h2>Projects</h2>
        <div class="actions">
          <button id="choose-folder" class="primary">Choose Folder</button>
          <button id="selected-project-action" disabled>Select a Folder</button>
        </div>
        <div id="selected-project" class="message">No folder selected.</div>
        <div id="recent-projects" class="grid" style="margin-top: 14px;"></div>
      </section>

      <section>
        <h2>Project Grants</h2>
        <div id="project-grants" class="grid"></div>
      </section>

      <section>
        <h2>Actions</h2>
        <div class="actions">
          <button id="start-bridge">Start Bridge</button>
          <button id="stop-bridge">Stop Bridge</button>
          <button id="copy-diagnostics">Copy Diagnostics</button>
          <button id="sign-in">Sign In</button>
          <button id="enable-remote">Enable Remote Access</button>
          <button id="disable-remote">Disable Remote Access</button>
          <button id="install-protocol">Install hunsu:// Handler</button>
        </div>
      </section>

      <section>
        <h2>Diagnostics</h2>
        <pre id="diagnostics">{}</pre>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
